name = "DSRV"
grammar = "dsrv"
path_suffixes = ["dsrv"]
line_comments = ["//"]

block_comment = ["(*", "*)"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "<", end = ">", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "(*", end = "*)", close = true, newline = false, not_in = ["comment", "string"] },
]
